<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAT Deployment Log</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #23272a; color: #f6f6f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .form-container { background-color: #2c2f33; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 500px; border-top: 5px solid #f04747; }
        h2 { text-align: center; margin-top: 0; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #99aab5; font-size: 14px; }
        select, input, textarea { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #23272a; background-color: #23272a; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        select:focus, input:focus, textarea:focus { border-color: #7289da; outline: none; }
        
        /* Officer Row Styling */
        .officer-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .officer-row input { margin-bottom: 0; flex: 2; }
        .officer-row select { margin-bottom: 0; flex: 1; }
        .remove-btn { background-color: #f04747; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .remove-btn:hover { background-color: #d83c3e; }
        
        .add-btn { background-color: #43b581; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px; display: inline-block; font-size: 13px; }
        .add-btn:hover { background-color: #3ca374; }
        
        button[type="submit"] { width: 100%; padding: 14px; background-color: #7289da; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        button[type="submit"]:hover { background-color: #677bc4; }

        /* Webhook URL Input */
        .webhook-section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #23272a; }
        .webhook-status { font-size: 12px; color: #72767d; margin-top: 5px; }
        .webhook-status.configured { color: #43b581; }
        .webhook-status.not-configured { color: #f04747; }
        .clear-webhook-btn { background-color: #72767d; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; margin-top: 8px; }
        .clear-webhook-btn:hover { background-color: #5d6064; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>SWAT Deployment Log</h2>
        
        <!-- Webhook Configuration Section -->
        <div class="webhook-section">
            <label for="webhookUrl">Discord Webhook URL</label>
            <input type="password" id="webhookUrl" placeholder="Paste Discord webhook URL (stored locally, never shared)">
            <div id="webhookStatus" class="webhook-status not-configured">❌ Not configured</div>
            <button type="button" class="clear-webhook-btn" id="clearWebhookBtn" style="display:none;">Clear Stored URL</button>
        </div>

        <form id="deploymentForm">
            
            <!-- Title Dropdown -->
            <label for="operationTitle">Operation Title</label>
            <select id="operationTitle" required>
                <option value="" disabled selected>Select Operation Designation</option>
                <option value="TSO-1">TSO-1</option>
                <option value="TSO-2">TSO-2</option>
                <option value="TSO-3">TSO-3</option>
                <option value="TSO-X">TSO-X</option>
                <option value="TSO-XO">TSO-XO</option>
            </select>

            <!-- Officers Section -->
            <label>Officers Involved</label>
            <div id="officersContainer">
                <div class="officer-row">
                    <input type="text" placeholder="Officer Name/Badge #" required class="officer-name">
                    <select class="officer-status">
                        <option value="🟢 ALIVE">Alive</option>
                        <option value="🔴 KNOCKED">Knocked</option>
                    </select>
                    <button type="button" class="remove-btn" onclick="removeOfficer(this)">X</button>
                </div>
            </div>
            <button type="button" class="add-btn" id="addOfficerBtn">+ Add Officer</button>

            <!-- Narrative Textarea -->
            <label for="narrative">Operation Narrative</label>
            <textarea id="narrative" rows="6" placeholder="Provide a detailed breakdown of the deployment..." required></textarea>

            <button type="submit">Submit Log</button>
        </form>
    </div>

    <script>
        // ============================================
        // WEBHOOK URL MANAGEMENT (localStorage)
        // ============================================
        const webhookInput = document.getElementById('webhookUrl');
        const webhookStatus = document.getElementById('webhookStatus');
        const clearWebhookBtn = document.getElementById('clearWebhookBtn');

        function updateWebhookStatus() {
            const storedUrl = localStorage.getItem('swatWebhookUrl');
            if (storedUrl) {
                webhookStatus.textContent = '✅ Configured';
                webhookStatus.classList.remove('not-configured');
                webhookStatus.classList.add('configured');
                clearWebhookBtn.style.display = 'block';
                webhookInput.value = storedUrl;
            } else {
                webhookStatus.textContent = '❌ Not configured';
                webhookStatus.classList.add('not-configured');
                webhookStatus.classList.remove('configured');
                clearWebhookBtn.style.display = 'none';
            }
        }

        webhookInput.addEventListener('change', function() {
            if (this.value.trim()) {
                localStorage.setItem('swatWebhookUrl', this.value.trim());
                updateWebhookStatus();
            }
        });

        clearWebhookBtn.addEventListener('click', function() {
            localStorage.removeItem('swatWebhookUrl');
            webhookInput.value = '';
            updateWebhookStatus();
            alert('Stored webhook URL has been cleared.');
        });

        // Load stored webhook on page load
        updateWebhookStatus();

        // ============================================
        // DYNAMIC OFFICER ROWS LOGIC
        // ============================================
        const container = document.getElementById('officersContainer');
        document.getElementById('addOfficerBtn').addEventListener('click', () => {
            const row = document.createElement('div');
            row.className = 'officer-row';
            row.innerHTML = `
                <input type="text" placeholder="Officer Name/Badge #" required class="officer-name">
                <select class="officer-status">
                    <option value="🟢 ALIVE">Alive</option>
                    <option value="🔴 KNOCKED">Knocked</option>
                </select>
                <button type="button" class="remove-btn" onclick="removeOfficer(this)">X</button>
            `;
            container.appendChild(row);
        });

        function removeOfficer(button) {
            // Prevent removing the last row if you want to enforce at least one officer
            if (container.children.length > 1) {
                button.parentElement.remove();
            } else {
                alert("At least one officer must be logged.");
            }
        }

        // ============================================
        // FORM SUBMISSION TO DISCORD
        // ============================================
        document.getElementById('deploymentForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get webhook URL from localStorage
            const webhookUrl = localStorage.getItem('swatWebhookUrl');

            if (!webhookUrl || webhookUrl.trim() === '') {
                alert("Please configure your Discord webhook URL first!");
                webhookInput.focus();
                return;
            }

            const title = document.getElementById('operationTitle').value;
            const narrative = document.getElementById('narrative').value;

            // Gather all officers and statuses
            const nameInputs = document.querySelectorAll('.officer-name');
            const statusSelects = document.querySelectorAll('.officer-status');
            let rosterList = "";

            nameInputs.forEach((input, index) => {
                const name = input.value;
                const status = statusSelects[index].value;
                rosterList += `${status} - ${name}\n`;
            });

            // Construct Discord Rich Embed payload
            const payload = {
                embeds: [{
                    title: `🚨 DEPLOYMENT LOG: ${title}`,
                    color: 15747399, // Tactical Red border
                    fields: [
                        {
                            name: "👥 Personnel Roster & Status",
                            value: rosterList || "No personnel logged.",
                            inline: false
                        },
                        {
                            name: "📝 Operation Narrative",
                            value: narrative,
                            inline: false
                        }
                    ],
                    timestamp: new Date().toISOString(),
                    footer: {
                        text: "SWAT Automated Logging System"
                    }
                }]
            };

            // Send payload to Discord
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert('Deployment log successfully dispatched to Discord.');
                    // Reset form & clear extra rows, keeping just one
                    document.getElementById('deploymentForm').reset();
                    container.innerHTML = `
                        <div class="officer-row">
                            <input type="text" placeholder="Officer Name/Badge #" required class="officer-name">
                            <select class="officer-status">
                                <option value="🟢 ALIVE">Alive</option>
                                <option value="🔴 KNOCKED">Knocked</option>
                            </select>
                            <button type="button" class="remove-btn" onclick="removeOfficer(this)">X</button>
                        </div>
                    `;
                } else {
                    alert('Failed to send log. Check webhook URL and Discord channel permissions.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while transmitting data. Check console for details.');
            });
        });
    </script>
</body>
</html>
